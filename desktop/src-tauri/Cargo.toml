[package]
name = "deepak-sir-nursing"
version = "1.0.0"
description = "Deepak Sir Nursing Classroom"
authors = ["Deepak Sir"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5.1", features = [] }

[dependencies]
tauri = { version = "1.6.0", features = ["fs-all", "shell-open", "window-all", "dialog-all"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.29.0", features = ["bundled"] }
dirs = "4.0"

[features]
default = []
custom-protocol = ["tauri/custom-protocol"]
