server:
  port: ${PORT:8080}
  shutdown: graceful
  servlet:
    context-path: /api

spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s
  application:
    name: deepak-sir-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/deepaksir}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 60000
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:noreply@deepaksir.com}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

jwt:
  secret: ${JWT_SECRET:your-256-bit-secret-key-here-change-in-production-make-64-chars}
  expiration: 86400000
  refresh-expiration: 604800000

ai:
  provider: ${AI_PROVIDER:openai}
  api-key: ${AI_API_KEY:sk-dummy}
  model: ${AI_MODEL:gpt-4-vision-preview}
  text-model: ${AI_TEXT_MODEL:gpt-4}
  vision-model: ${AI_VISION_MODEL:gpt-4-vision-preview}
  max-tokens: ${AI_MAX_TOKENS:2000}
  temperature: ${AI_TEMPERATURE:0.7}
  timeout: ${AI_TIMEOUT:60000}
  max-image-size: ${AI_MAX_IMAGE_SIZE:5242880}
  allowed-image-types: jpg,jpeg,png,webp
  max-requests-per-minute: ${AI_RATE_LIMIT_MINUTE:10}
  max-requests-per-hour: ${AI_RATE_LIMIT_HOUR:100}
  max-chats-per-user: ${AI_MAX_CHATS:50}
  system-prompt: |
    You are a knowledgeable Nursing Education Assistant for Deepak Sir Nursing platform.
    Provide educational info about nursing, medical topics, anatomy, physiology, pharmacology.
    NEVER provide medical diagnoses or prescriptions. Be supportive and exam-focused.
  safety-prompt: |
    IMPORTANT SAFETY GUIDELINES:
    - Do not claim to diagnose any medical condition.
    - Do not prescribe medications or change dosages.
    - Focus on nursing education, not medical practice.

storage:
  type: ${STORAGE_TYPE:local}
  local:
    path: ${STORAGE_LOCAL_PATH:./uploads}

payment:
  razorpay:
    key-id: ${RAZORPAY_KEY_ID:your-key-id}
    key-secret: ${RAZORPAY_KEY_SECRET:your-key-secret}

google:
  client-id: ${GOOGLE_CLIENT_ID:your-google-client-id}

app:
  base-url: ${APP_BASE_URL:http://localhost:8080}