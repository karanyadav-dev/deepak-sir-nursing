name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses-dev \
            cmake \
            libffi-dev \
            libssl-dev \
            ccache
      
      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install buildozer==1.5.0 cython==0.29.33
      
      - name: Create buildozer.spec
        run: |
          cd frontend
          cat > buildozer.spec << 'EOF'
          [app]
          title = Deepak Sir Nursing
          package.name = deepaksir
          package.domain = com.deepaksir
          source.dir = .
          source.include_exts = py,png,jpg,kv,atlas,ttf,json
          version = 1.0.0
          requirements = python3,kivy==2.2.1,kivymd==1.1.1,cython==0.29.33,requests,urllib3,chardet,idna,certifi,plyer
          orientation = portrait
          fullscreen = 0
          
          [android]
          permissions = INTERNET,ACCESS_NETWORK_STATE,CAMERA
          android.api = 30
          android.minapi = 21
          android.ndk = 25b
          android.arch = arm64-v8a
          android.entrypoint = org.kivy.android.PythonActivity
          android.private_storage = True
          android.accept_sdk_license = True
          android.bootstrap = sdl2
          
          [python]
          source.include_py = main.py
          
          [buildozer]
          log_level = 2
          warn_on_root = 1
          EOF
      
      - name: Build APK
        run: |
          cd frontend
          buildozer -v android debug
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: deepaksir-apk
          path: frontend/bin/*.apk