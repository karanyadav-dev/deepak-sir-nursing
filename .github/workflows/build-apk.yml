name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev
      
      - name: Install Python dependencies
        run: |
          pip install buildozer==1.5.0 cython==0.29.33
      
      - name: Accept Android SDK licenses
        run: |
          mkdir -p /usr/local/lib/android/sdk/licenses
          echo -e "\n8933bad161af4178b1185d1a37fbf41ea5269c55\n" > /usr/local/lib/android/sdk/licenses/android-sdk-license
          echo -e "\nd56f5187479451eabf01fb78af6dfcb131a6481e\n" > /usr/local/lib/android/sdk/licenses/android-sdk-preview-license
          echo -e "\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n" > /usr/local/lib/android/sdk/licenses/android-sdk-preview-license
      
      - name: Fix buildozer spec
        run: |
          cd frontend
          sed -i 's/kivy==2.3.1/kivy==2.2.1/' buildozer.spec
          sed -i 's/requests==2.31.0/requests/' buildozer.spec
          sed -i 's/httpx==0.25.0/httpx/' buildozer.spec
          sed -i 's/plyer==2.1.0/plyer/' buildozer.spec
          sed -i 's/pillow==10.0.0/pillow/' buildozer.spec
          sed -i 's/android.api = 31/android.api = 30/' buildozer.spec
          sed -i 's/android.ndk = 25b/android.ndk = 27b/' buildozer.spec
      
      - name: Create symlink for buildozer
        run: |
          # Buildozer ko system SDK use karne ke liye symlink banao
          mkdir -p $HOME/.buildozer/android/platform
          ln -sf /usr/local/lib/android/sdk $HOME/.buildozer/android/platform/android-sdk
          ln -sf /usr/local/lib/android/sdk/ndk/27.3.13750724 $HOME/.buildozer/android/platform/android-ndk-r27b
      
      - name: Build APK
        run: |
          cd frontend
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          export ANDROID_NDK_HOME=/usr/local/lib/android/sdk/ndk/27.3.13750724
          export PATH=$PATH:/usr/local/lib/android/sdk/platform-tools:/usr/local/lib/android/sdk/build-tools
          buildozer android debug
      
      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: deepaksir-apk
          path: frontend/bin/*.apk