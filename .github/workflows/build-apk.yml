name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git zip unzip \
            openjdk-17-jdk autoconf libtool \
            pkg-config zlib1g-dev libncurses-dev \
            cmake libffi-dev libssl-dev ccache
      
      - name: Install Python Dependencies
        run: |
          pip install --upgrade pip
          pip install buildozer==1.5.0 cython==0.29.33
      
      - name: Download Android SDK
        run: |
          mkdir -p $HOME/android-sdk/cmdline-tools
          cd $HOME/android-sdk
          
          # Download
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          
          # Extract into temp folder
          unzip -q commandlinetools-linux-11076708_latest.zip -d cmdline-tools-temp
          
          # ZIP ka structure: cmdline-tools/cmdline-tools
          # Move it to proper location
          mv cmdline-tools-temp/cmdline-tools $HOME/android-sdk/cmdline-tools/latest
          
          # Cleanup
          rm -rf cmdline-tools-temp
          rm -f commandlinetools-linux-11076708_latest.zip
          
          # Make executable
          chmod +x $HOME/android-sdk/cmdline-tools/latest/bin/*
          
          # Verify
          echo "=== Structure ==="
          ls -la $HOME/android-sdk/cmdline-tools/latest/bin/
      
      - name: Setup Android SDK
        run: |
          export ANDROID_HOME=$HOME/android-sdk
          export ANDROID_SDK_ROOT=$HOME/android-sdk
          export PATH=$PATH:$HOME/android-sdk/cmdline-tools/latest/bin
          
          # Accept licenses
          yes | sdkmanager --licenses --sdk_root=$ANDROID_HOME || true
          
          # Install packages
          sdkmanager "platform-tools" --sdk_root=$ANDROID_HOME || true
          sdkmanager "platforms;android-33" --sdk_root=$ANDROID_HOME || true
          sdkmanager "build-tools;33.0.2" --sdk_root=$ANDROID_HOME || true
          
          # Setup for buildozer
          mkdir -p $HOME/.buildozer/android/platform
          ln -sf $HOME/android-sdk $HOME/.buildozer/android/platform/android-sdk
          
          # Create tools/bin symlink
          mkdir -p $HOME/android-sdk/tools/bin
          ln -sf $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager $HOME/android-sdk/tools/bin/sdkmanager
          
          # Verify
          echo "=== SDK Contents ==="
          ls -la $ANDROID_HOME/
          echo ""
          echo "=== Build tools ==="
          ls -la $ANDROID_HOME/build-tools/ 2>/dev/null || echo "no build-tools"
      
      - name: Create buildozer.spec
        run: |
          cd frontend
          cat > buildozer.spec << 'EOF'
          [app]
          title = Deepak Sir Nursing
          package.name = deepaksir
          package.domain = com.deepaksir
          source.dir = .
          source.include_exts = py,png,jpg,kv,atlas,ttf,json
          version = 1.0.0
          requirements = python3,kivy==2.2.1,kivymd==1.1.1,cython==0.29.33,requests,urllib3,chardet,idna,certifi,plyer
          orientation = portrait
          fullscreen = 0
          
          [android]
          permissions = INTERNET,ACCESS_NETWORK_STATE,CAMERA
          android.api = 33
          android.minapi = 21
          android.ndk = 25b
          android.arch = arm64-v8a
          android.entrypoint = org.kivy.android.PythonActivity
          android.private_storage = True
          android.accept_sdk_license = True
          android.bootstrap = sdl2
          android.sdk_path = /home/runner/.buildozer/android/platform/android-sdk
          
          [python]
          source.include_py = main.py
          
          [buildozer]
          log_level = 2
          warn_on_root = 1
          EOF
          cat buildozer.spec
      
      - name: Build APK
        env:
          ANDROID_HOME: /home/runner/android-sdk
          ANDROID_SDK_ROOT: /home/runner/android-sdk
        run: |
          cd frontend
          export PATH=$PATH:$HOME/android-sdk/cmdline-tools/latest/bin:$HOME/android-sdk/tools/bin
          buildozer -v android debug 2>&1 | tee build.log || true
          
          echo ""
          echo "=== After Build ==="
          ls -la frontend/bin/ 2>/dev/null || echo "bin folder nahi bana"
          find /home/runner -name "*.apk" 2>/dev/null || echo "APK not found"
      
      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deepaksir-apk
          path: |
            frontend/bin/*.apk
            **/*.apk
          if-no-files-found: warn
      
      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: frontend/build.log
          if-no-files-found: warn