name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses-dev \
            cmake \
            libffi-dev \
            libssl-dev \
            ccache \
            python3-dev
      
      - name: Install Python Dependencies
        run: |
          pip install --upgrade pip
          pip install buildozer==1.5.0 cython==0.29.33
      
      - name: Setup Android SDK (Complete)
        run: |
          # Create SDK directory
          mkdir -p $HOME/android-sdk
          cd $HOME/android-sdk
          
          # Download Android command line tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-11076708_latest.zip
          rm -f commandlinetools-linux-11076708_latest.zip
          
          # Setup proper directory structure
          mkdir -p cmdline-tools
          mv cmdline-tools latest
          mv latest cmdline-tools/latest
          chmod +x cmdline-tools/latest/bin/*
          
          # Set environment
          export ANDROID_HOME=$HOME/android-sdk
          export ANDROID_SDK_ROOT=$HOME/android-sdk
          export PATH=$PATH:$HOME/android-sdk/cmdline-tools/latest/bin
          
          # Accept all licenses
          yes | sdkmanager --licenses --sdk_root=$ANDROID_HOME || true
          
          # Install required packages
          sdkmanager "platform-tools" --sdk_root=$ANDROID_HOME || true
          sdkmanager "platforms;android-33" --sdk_root=$ANDROID_HOME || true
          sdkmanager "build-tools;33.0.2" --sdk_root=$ANDROID_HOME || true
          
          # Create tools/bin/sdkmanager symlink for buildozer
          mkdir -p $HOME/android-sdk/tools/bin
          ln -sf $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager $HOME/android-sdk/tools/bin/sdkmanager
          
          # Create buildozer symlink
          mkdir -p $HOME/.buildozer/android/platform
          ln -sf $HOME/android-sdk $HOME/.buildozer/android/platform/android-sdk
          
          # Verify
          echo "=== SDK Contents ==="
          ls -la $HOME/android-sdk/
          echo ""
          echo "=== Build Tools ==="
          ls -la $HOME/android-sdk/build-tools/ || echo "no build-tools"
          echo ""
          echo "=== sdkmanager ==="
          $HOME/android-sdk/tools/bin/sdkmanager --version || echo "sdkmanager not working"
      
      - name: Create buildozer.spec
        run: |
          cd frontend
          cat > buildozer.spec << 'EOF'
          [app]
          title = Deepak Sir Nursing
          package.name = deepaksir
          package.domain = com.deepaksir
          source.dir = .
          source.include_exts = py,png,jpg,kv,atlas,ttf,json
          version = 1.0.0
          requirements = python3,kivy==2.2.1,kivymd==1.1.1,cython==0.29.33,requests,urllib3,chardet,idna,certifi,plyer
          orientation = portrait
          fullscreen = 0
          icon.filename = %(source.dir)s/app/assets/images/icon.png
          
          [android]
          permissions = INTERNET,ACCESS_NETWORK_STATE,CAMERA,READ_EXTERNAL_STORAGE,WRITE_EXTERNAL_STORAGE
          android.api = 33
          android.minapi = 21
          android.ndk = 25b
          android.arch = arm64-v8a
          android.entrypoint = org.kivy.android.PythonActivity
          android.private_storage = True
          android.accept_sdk_license = True
          android.bootstrap = sdl2
          android.sdk_path = /home/runner/.buildozer/android/platform/android-sdk
          
          [python]
          source.include_py = main.py
          
          [buildozer]
          log_level = 2
          warn_on_root = 1
          EOF
          cat buildozer.spec
      
      - name: Build APK
        env:
          ANDROID_HOME: /home/runner/android-sdk
          ANDROID_SDK_ROOT: /home/runner/android-sdk
          PATH: /home/runner/android-sdk/cmdline-tools/latest/bin:/home/runner/android-sdk/tools/bin:/home/runner/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        run: |
          cd frontend
          buildozer -v android debug 2>&1 | tee build.log || true
          
          echo ""
          echo "=== Build Complete - Checking Output ==="
          find /home/runner -name "*.apk" 2>/dev/null || echo "No APK found"
          ls -la frontend/bin/ 2>/dev/null || echo "No bin folder"
      
      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deepaksir-apk
          path: |
            frontend/bin/*.apk
            **/*.apk
          if-no-files-found: warn
      
      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: frontend/build.log
          if-no-files-found: warn
      
      - name: Show Build Summary
        if: always()
        run: |
          echo "================================"
          echo "BUILD SUMMARY"
          echo "================================"
          echo ""
          echo "=== APK Files Found ==="
          find /home/runner/work -name "*.apk" 2>/dev/null | head -20 || echo "None"
          echo ""
          echo "=== bin folder ==="
          ls -la /home/runner/work/deepak-sir-nursing/deepak-sir-nursing/frontend/bin/ 2>/dev/null || echo "Empty/Missing"
          echo ""
          echo "=== Last 50 lines of build log ==="
          tail -50 /home/runner/work/deepak-sir-nursing/deepak-sir-nursing/frontend/build.log 2>/dev/null || echo "No log"