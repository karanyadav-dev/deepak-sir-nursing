name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev
      
      - name: Install Python dependencies
        run: |
          pip install buildozer==1.5.0 cython==0.29.33
      
      - name: Install Android SDK Command Line Tools
        run: |
          mkdir -p $HOME/.buildozer/android/platform/android-sdk/cmdline-tools
          cd $HOME/.buildozer/android/platform/android-sdk/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-11076708_latest.zip
          mv cmdline-tools latest
          rm commandlinetools-linux-11076708_latest.zip
      
      - name: Accept Android SDK licenses
        run: |
          mkdir -p $HOME/.buildozer/android/platform/android-sdk/licenses
          echo -e "\n8933bad161af4178b1185d1a37fbf41ea5269c55\n" > $HOME/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
          echo -e "\nd56f5187479451eabf01fb78af6dfcb131a6481e\n" > $HOME/.buildozer/android/platform/android-sdk/licenses/android-sdk-preview-license
      
      - name: Fix buildozer spec
        run: |
          cd frontend
          sed -i 's/kivy==2.3.1/kivy==2.2.1/' buildozer.spec
          sed -i 's/requests==2.31.0/requests/' buildozer.spec
          sed -i 's/httpx==0.25.0/httpx/' buildozer.spec
          sed -i 's/plyer==2.1.0/plyer/' buildozer.spec
          sed -i 's/pillow==10.0.0/pillow/' buildozer.spec
          sed -i 's/android.api = 31/android.api = 30/' buildozer.spec
      
      - name: Build APK
        run: |
          cd frontend
          buildozer android debug
      
      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: deepaksir-apk
          path: frontend/bin/*.apk