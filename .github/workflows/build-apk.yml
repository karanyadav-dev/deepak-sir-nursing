name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git zip unzip \
            openjdk-17-jdk autoconf libtool pkg-config \
            zlib1g-dev libncurses-dev cmake libffi-dev \
            libssl-dev ccache
      
      - name: Install Python Dependencies
        run: |
          pip install --upgrade pip
          pip install buildozer==1.5.0 cython==0.29.33
      
      - name: Download Android Command Line Tools
        run: |
          mkdir -p $HOME/android-sdk/cmdline-tools
          cd $HOME/android-sdk/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-11076708_latest.zip
          mv cmdline-tools latest
          rm -f commandlinetools-linux-11076708_latest.zip
          chmod +x $HOME/android-sdk/cmdline-tools/latest/bin/*
      
      - name: Setup Android SDK Environment
        run: |
          export ANDROID_HOME=$HOME/android-sdk
          export ANDROID_SDK_ROOT=$HOME/android-sdk
          export PATH=$PATH:$HOME/android-sdk/cmdline-tools/latest/bin
          
          # Accept all licenses
          yes | sdkmanager --licenses --sdk_root=$HOME/android-sdk || true
          
          # Install build tools and platform
          sdkmanager "build-tools;33.0.2" --sdk_root=$HOME/android-sdk || true
          sdkmanager "platforms;android-33" --sdk_root=$HOME/android-sdk || true
          sdkmanager "platform-tools" --sdk_root=$HOME/android-sdk || true
          
          # Save env for next steps
          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> $GITHUB_ENV
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
      
      - name: Setup Buildozer Config
        run: |
          cd frontend
          cat > buildozer.spec << 'EOF'
          [app]
          title = Deepak Sir Nursing
          package.name = deepaksir
          package.domain = com.deepaksir
          source.dir = .
          source.include_exts = py,png,jpg,kv,atlas,ttf,json
          version = 1.0.0
          requirements = python3,kivy==2.2.1,kivymd==1.1.1,cython==0.29.33,requests,urllib3,chardet,idna,certifi,plyer
          orientation = portrait
          fullscreen = 0
          
          [android]
          permissions = INTERNET,ACCESS_NETWORK_STATE,CAMERA
          android.api = 33
          android.minapi = 21
          android.ndk = 25b
          android.arch = arm64-v8a
          android.entrypoint = org.kivy.android.PythonActivity
          android.private_storage = True
          android.accept_sdk_license = True
          android.bootstrap = sdl2
          android.sdk_path = /home/runner/android-sdk
          
          [python]
          source.include_py = main.py
          
          [buildozer]
          log_level = 2
          warn_on_root = 1
          EOF
          cat buildozer.spec
      
      - name: Copy SDK to Buildozer Path
        run: |
          mkdir -p $HOME/.buildozer/android/platform
          ln -sf $HOME/android-sdk $HOME/.buildozer/android/platform/android-sdk
          echo "=== SDK Link ==="
          ls -la $HOME/.buildozer/android/platform/
      
      - name: Build APK
        run: |
          cd frontend
          export ANDROID_HOME=$HOME/android-sdk
          export ANDROID_SDK_ROOT=$HOME/android-sdk
          export PATH=$PATH:$HOME/android-sdk/cmdline-tools/latest/bin
          buildozer -v android debug
      
      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deepaksir-apk
          path: frontend/bin/*.apk
          if-no-files-found: warn
      
      - name: List Output
        if: always()
        run: |
          echo "=== APK Files ==="
          ls -la frontend/bin/ || echo "No bin folder"