name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Install system packages
        run: |
          sudo apt update
          sudo apt install -y \
            git zip unzip openjdk-17-jdk \
            autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            libtinfo5 cmake libffi-dev libssl-dev \
            build-essential ccache
      
      - name: Install buildozer
        run: |
          pip install --upgrade pip
          pip install buildozer==1.5.0 cython==0.29.33
      
      - name: Update buildozer.spec
        run: |
          cd frontend
          python3 -c "
          import re
          with open('buildozer.spec', 'r') as f:
              content = f.read()
          
          # Force set requirements
          content = re.sub(
              r'^requirements\s*=.*$',
              'requirements = python3,kivy==2.2.1,kivymd==1.1.1,cython==0.29.33,requests,urllib3,chardet,idna,certifi,plyer',
              content,
              flags=re.MULTILINE
          )
          
          # Force set API level
          content = re.sub(
              r'^android\.api\s*=.*$',
              'android.api = 30',
              content,
              flags=re.MULTILINE
          )
          
          # Force accept license
          if 'android.accept_sdk_license' not in content:
              content += '\nandroid.accept_sdk_license = True\n'
          
          with open('buildozer.spec', 'w') as f:
              f.write(content)
          
          print('Updated buildozer.spec:')
          print(content)
          "
      
      - name: Build APK
        run: |
          cd frontend
          buildozer android debug 2>&1 | tee build_output.log
      
      - name: Find APK
        if: always()
        run: |
          echo "=== Searching for APK ==="
          find . -name "*.apk" 2>/dev/null
          ls -la frontend/bin/ 2>/dev/null || echo "bin folder check"
      
      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: |
            frontend/bin/*.apk
            **/*.apk
          if-no-files-found: warn
      
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: |
            frontend/build_output.log
            frontend/.buildozer/**/*.log
          if-no-files-found: warn